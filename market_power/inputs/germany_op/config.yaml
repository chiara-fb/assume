base_case_2019:
  start_date: 2019-01-01 00:00
  end_date: 2019-02-01 00:00 
  time_step: 1h
  industrial_dsm_units: null
  save_frequency_hours: 720

  markets_config:

    EOM:
      operator: EOM_operator
      product_type: energy
      start_date: 2019-01-01 00:00
      products:
        - duration: 1h
          count: 1
          first_delivery: 1h 
      opening_frequency: 1h
      opening_duration: 1h
      volume_unit: MWh
      maximum_bid_volume: 100000
      maximum_bid_price: 3000
      minimum_bid_price: -500
      price_unit: EUR/MWh
      market_mechanism: pay_as_clear

  bidding_strategy_params: 
    nbins: 5 # number of segment for the cost curve
    foresight: 6
    steps: 1

  learning_config: 
    learning_mode: True
    continue_learning: false
    trained_policies_save_path: null
    min_bid_price: 0
    max_bid_price: 360
    algorithm: matd3
    learning_rate: 0.0001
    # learning_rate_schedule: linear
    training_episodes: 30
    episodes_collecting_initial_experience: 5
    train_freq: 100h
    gradient_steps: 1
    batch_size: 128
    gamma: 0.85 # lowered gamma because to care about the next ~6 steps
    device: cuda:0
    action_noise_schedule: linear
    noise_sigma: 0.1
    noise_scale: 1
    noise_dt: 1
    validation_episodes_interval: 5
    # early_stopping_steps: 10
    # early_stopping_threshold: 0.05
